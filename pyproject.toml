[project]
name = "backend-api"
version = "0.1.0"
description = "JWT 인증 기반 RESTful 게시판 API (FastAPI + SQLAlchemy + PostgreSQL)"
readme = "README.md"
authors = [
    { name = "766min", email = "pq2476@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "aiofiles>=25.1.0",
    "asyncpg>=0.32.0",
    "bcrypt>=5.0.0",
    "fastapi>=0.163.1",
    "pydantic[email]>=2.14.3",
    "pyjwt>=2.15.1",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.33",
    "sqlalchemy[asyncio]>=2.1.8",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

# 수업 프로젝트와 동일: 패키지로 설치하지 않고 src 폴더를 그대로 실행
[tool.uv]
package = false
